<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title>test</title>
        <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@3/dist/fp.min.js"></script>

        <script>
            let visitorId = null;
            async function loadData() {
                // Loads and/or modifies google sheet saved data

                // Load the FingerprintJS library
                const fp = await FingerprintJS.load();
                const result = await fp.get();
                visitorId = result.visitorId;
                console.log("User ID:", visitorId);

                // Fetch google sheet
                try {
                    const response = await fetch(
                        "https://script.google.com/macros/s/AKfycbzgKMTVyTVGD4y63agrWAo4r5yV2ACvJ0G3T0OBefDEBUB5kzZS0mwGNnAVxLrwFPI/exec"
                    );
                    const data = await response.json();
                    console.log("google sheet", data);

                    visitorExists = false;
                    for (i = 1; i < data.length; i++) {
                        if (visitorId == data[i][0]) {
                            visitorExists = true;
                            console.log("visitor exists already");
                            break;
                        }
                    }
                    if (!visitorExists) {
                        const formData = new URLSearchParams();
                        formData.append("content", visitorId);
                        formData.append("append", "true");
                        await fetch(
                            "https://script.google.com/macros/s/AKfycbzgKMTVyTVGD4y63agrWAo4r5yV2ACvJ0G3T0OBefDEBUB5kzZS0mwGNnAVxLrwFPI/exec",
                            {
                                method: "POST",
                                headers: {
                                    "Content-Type":
                                        "application/x-www-form-urlencoded",
                                },
                                body: formData,
                            }
                        )
                            .then((res) => res.json())
                            .then((data) => console.log("Success:", data))
                            .catch((err) => console.error("Fetch error:", err));
                    }
                } catch (error) {
                    console.error("Error getting google sheet", error);
                }
            }
            loadData();
        </script>
    </head>
    <body>
        <p>Google sheet api test</p>
    </body>
</html>
